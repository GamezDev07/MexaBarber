<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Test UTF-8 - Barberos</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
        }

        .barbero-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .barbero-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .barbero-nombre {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .barbero-especialidad {
            text-align: center;
            opacity: 0.9;
            margin-top: 5px;
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✅ Test de UTF-8 - Barberos</h1>

        <div id="status" class="status loading">
            ⏳ Cargando barberos...
        </div>

        <div id="barberos-container"></div>

        <div class="info status" style="margin-top: 30px;">
            <strong>¿Qué deberías ver?</strong><br>
            Si los nombres muestran correctamente "Raúl", "Martínez", "López" con acentos,
            entonces el fix UTF-8 funcionó. ✅<br><br>
            Si ves "Ra??l", "Mart??nez", "L??pez", el problema persiste. ❌
        </div>
    </div>

    <script>
        async function cargarBarberos() {
            const container = document.getElementById('barberos-container');
            const status = document.getElementById('status');

            try {
                const response = await fetch('/api/barberos');
                const barberos = await response.json();

                if (barberos.length === 0) {
                    status.className = 'status error';
                    status.innerHTML = '❌ No se encontraron barberos';
                    return;
                }

                status.className = 'status success';
                status.innerHTML = `✅ Se encontraron ${barberos.length} barberos`;

                barberos.forEach(barbero => {
                    const card = document.createElement('div');
                    card.className = 'barbero-card';
                    card.innerHTML = `
                        <div class="barbero-icon">✂️</div>
                        <div class="barbero-nombre">${barbero.nombre}</div>
                        <div class="barbero-especialidad">${barbero.especialidad || 'Barbero'}</div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                status.className = 'status error';
                status.innerHTML = '❌ Error al cargar: ' + error.message;
            }
        }

        // Cargar al iniciar
        window.addEventListener('load', cargarBarberos);
    </script>
</body>

</html>
